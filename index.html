<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROUBIEN's Elden Ring – Item Hunt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --gold: #C8A96E;
    --gold-dark: #8B6914;
    --gold-glow: rgba(200,169,110,0.35);
    --bg-deep: #0A0806;
    --bg-panel: #12100D;
    --bg-card: #1A1712;
    --bg-card2: #221F19;
    --text: #E8DCC8;
    --text-dim: #8A7D6A;
    --text-muted: #4A4035;
    --border: rgba(200,169,110,0.18);
    --border-strong: rgba(200,169,110,0.4);
    --red: #C84B4B;
    --green: #4B9B6F;
    --green-bg: rgba(75,155,111,0.15);
    --red-bg: rgba(200,75,75,0.15);
    /* ── Design-Anpassungen ── */
    --design-accent: #C8A96E;
    --design-bg: #0A0806;
    --design-card: #1A1712;
    --design-text: #E8DCC8;
    --design-found-bg: rgba(75,155,111,0.15);
    --design-found-border: #4B9B6F;
    --design-found-text: #4B9B6F;
    --design-font-size: 15px;
    --design-obs-bg: rgba(10,8,6,0.92);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  h1, h2, h3, .heading { font-family: 'Cinzel', serif; }

  /* ── Layout ── */
  .page { max-width: 700px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }

  .logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .logo-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.8;
  }
  .logo-sub {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 0.12em;
  }

  /* ── Cards ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .card-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gold);
    opacity: 0.7;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* ── Inputs ── */
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 5px; }
  input[type=text], input[type=number], select {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--gold-dark); }
  select option { background: var(--bg-panel); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 20px;
    border-radius: 5px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-decoration: none;
  }
  .btn:hover { background: rgba(200,169,110,0.08); }
  .btn-primary {
    background: var(--gold-dark);
    border-color: var(--gold);
    color: #0A0806;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--gold); }
  .btn-found {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
    font-size: 16px;
    padding: 14px 28px;
    width: 100%;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.1em;
  }
  .btn-found:hover { background: rgba(75,155,111,0.25); }
  .btn-found:disabled { opacity: 0.35; cursor: default; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1rem; }
  .btn-sm { padding: 6px 14px; font-size: 11px; }

  /* ── URL Box ── */
  .url-box {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 12px;
    font-family: monospace;
    font-size: 12px;
    color: var(--gold);
    word-break: break-all;
    margin-bottom: 6px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s;
  }
  .url-box:hover { border-color: var(--gold-dark); }
  .url-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .copy-hint { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
  .url-block { margin-bottom: 14px; }

  /* ── Scoreboard ── */
  .scores {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem;
  }
  .score-pill {
    display: flex; flex-direction: column; align-items: center;
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 18px;
    min-width: 100px;
    flex: 1;
    text-align: center;
  }
  .score-pill.leader {
    border-color: var(--gold);
    background: rgba(200,169,110,0.07);
  }
  .score-name { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .score-pts {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: var(--text);
  }
  .score-pill.leader .score-pts { color: var(--gold); }
  .score-crown { font-size: 10px; color: var(--gold); margin-top: 2px; }

  /* ── Item Display ── */
  .item-display {
    text-align: center;
    padding: 1.5rem 1rem;
  }
  .item-img-wrap {
    width: 140px; height: 140px;
    margin: 0 auto 1.25rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--bg-deep);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .item-img-wrap img {
    width: 120px; height: 120px;
    object-fit: contain;
    image-rendering: auto;
  }
  .item-cat-badge {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--gold);
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    padding: 3px 10px;
    margin-bottom: 10px;
  }
  .item-name-de {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .item-name-en {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-style: italic;
    letter-spacing: 0.03em;
  }
  .item-hint {
    font-size: 15px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 4px;
    line-height: 1.6;
  }
  .item-hint-label {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .progress-text {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
  }

  /* ── History ── */
  .history-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-item { color: var(--text); }
  .history-player { color: var(--green); font-size: 12px; }
  .history-skip { color: var(--text-muted); font-size: 12px; font-style: italic; }
  .history-round { color: var(--text-muted); font-size: 11px; min-width: 30px; }

  /* ── Alerts / Banners ── */
  .found-banner {
    background: var(--green-bg);
    border: 1px solid var(--green);
    border-radius: 6px;
    padding: 10px 16px;
    text-align: center;
    color: var(--green);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    animation: fadeIn 0.4s ease;
  }
  .winner-card {
    background: rgba(200,169,110,0.06);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1rem;
  }
  .winner-title {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .winner-sub { font-size: 13px; color: var(--text-dim); }

  /* ── Loading / Error ── */
  .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 14px; }
  .error-msg {
    background: var(--red-bg); border: 1px solid var(--red);
    border-radius: 6px; padding: 12px 16px;
    color: var(--red); font-size: 13px; margin-bottom: 1rem;
  }

  /* ── OBS Mode ── */
  body.obs-mode {
    background: transparent !important;
    padding: 0;
    min-height: unset;
  }
  .obs-overlay {
    background: var(--design-obs-bg, rgba(10,8,6,0.92));
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    width: 900px;
    backdrop-filter: blur(8px);
  }
  .obs-header {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    color: var(--gold);
    opacity: 0.6;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .obs-item-row {
    display: flex; align-items: center; gap: 18px; margin-bottom: 14px;
  }
  .obs-img {
    width: 130px; height: 130px;
    background: var(--bg-deep);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .obs-img img { width: 110px; height: 110px; object-fit: contain; image-rendering: auto; }
  .obs-item-name {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1.2;
  }
  .obs-item-en {
    font-size: 16px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 4px;
    margin-bottom: 6px;
  }
  .obs-item-cat {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
  }
  .obs-hint {
    font-size: 16px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .obs-scores {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .obs-score-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 18px;
    font-size: 16px;
  }
  .obs-score-chip.leader { border-color: var(--gold); color: var(--gold); }
  .obs-score-name { color: var(--text-dim); font-size: 15px; }
  .obs-score-pts { font-family: 'Cinzel', serif; font-size: 26px; }
  .obs-progress {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.15em;
    text-align: right;
    margin-top: 8px;
    font-family: 'Cinzel', serif;
  }
  .obs-finished {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-align: center;
    padding: 1rem;
  }

  /* ── Player Mode ── */
  .player-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .player-name-tag {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--gold);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 5px 18px;
    margin-bottom: 4px;
  }
  .waiting-pulse {
    animation: pulse 2s infinite;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 2rem;
  }
  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

  /* ── Divider ── */
  .divider {
    border: none; border-top: 1px solid var(--border);
    margin: 1rem 0;
  }

  /* ── Tabs ── */
  .tab-row { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 9px 18px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Misc ── */
  .text-muted { color: var(--text-muted); font-size: 12px; }
  .text-gold { color: var(--gold); }
  .mt-sm { margin-top: 8px; }
  .mt-md { margin-top: 16px; }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; cursor: pointer;
    font-size: 13px; color: var(--text);
  }
  .checkbox-row input { width: auto; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    background: rgba(200,169,110,0.12);
    color: var(--gold);
    border: 1px solid var(--border);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.05em;
  }

  /* ── Design Panel ── */
  .design-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 320px;
    background: #0D0B09;
    border-left: 1px solid var(--border-strong);
    z-index: 1000;
    overflow-y: auto;
    padding: 1.5rem;
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }
  .design-panel.open { transform: translateX(0); }
  .design-toggle {
    position: fixed; top: 1rem; right: 1rem;
    z-index: 1001;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
  }
  .design-toggle:hover { background: var(--bg-card2); }
  .design-section { margin-bottom: 1.5rem; }
  .design-section-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold);
    opacity: 0.6;
    text-transform: uppercase;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .design-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .design-label { font-size: 12px; color: var(--text-dim); }
  .design-row input[type=color] {
    width: 40px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: none;
    cursor: pointer;
    padding: 2px;
  }
  .design-row input[type=range] { width: 120px; accent-color: var(--gold); }
  .design-row input[type=text] { width: 120px; font-size: 12px; }
  .design-row select { width: 140px; font-size: 12px; }
  .design-preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .preset-btn {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-card2);
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'Cinzel', serif;
  }
  .preset-btn:hover { border-color: var(--gold); color: var(--gold); }
  .design-save-row { margin-top: 1rem; }
  /* Hotkey badge */
  .hotkey-badge {
    display: inline-block;
    font-family: monospace;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-strong);
    background: var(--bg-deep);
    color: var(--text-dim);
    margin-left: 8px;
  }
  .hotkey-listening {
    border-color: var(--gold) !important;
    color: var(--gold) !important;
    animation: pulse 1s infinite;
  }

  /* ── Fehler-Banner ── */
  #global-error {
    display: none;
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    z-index: 9999;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    animation: fadeIn 0.3s ease;
  }
  #global-error.success {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="global-error"></div>

let currentDesign = {};

function loadDesign() {
  try {
    const saved = localStorage.getItem(DESIGN_KEY);
    currentDesign = saved ? JSON.parse(saved) : { ...PRESETS["Elden Ring"] };
  } catch(e) {
    currentDesign = { ...PRESETS["Elden Ring"] };
  }
  applyDesign(currentDesign);
}

function saveDesign(d) {
  currentDesign = { ...d };
  localStorage.setItem(DESIGN_KEY, JSON.stringify(d));
  applyDesign(d);
}

function applyDesign(d) {
  const r = document.documentElement.style;
  r.setProperty("--gold", d.accent);
  r.setProperty("--gold-dark", shadeColor(d.accent, -30));
  r.setProperty("--border", d.accent + "2E");
  r.setProperty("--border-strong", d.accent + "66");
  r.setProperty("--bg-deep", d.bg);
  r.setProperty("--bg-panel", shadeColor(d.bg, 5));
  r.setProperty("--bg-card", d.card);
  r.setProperty("--bg-card2", shadeColor(d.card, 8));
  r.setProperty("--text", d.text);
  r.setProperty("--text-dim", d.text + "AA");
  r.setProperty("--text-muted", d.text + "55");
  r.setProperty("--green-bg", d.foundBg);
  r.setProperty("--green", d.foundBorder);
  r.setProperty("--design-obs-bg", d.obsBg);
  document.body.style.fontSize = (d.fontSize || 15) + "px";
}

function shadeColor(hex, pct) {
  // simple lighten/darken for hex colors
  try {
    let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    r=Math.max(0,Math.min(255,r+pct)); g=Math.max(0,Math.min(255,g+pct)); b=Math.max(0,Math.min(255,b+pct));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  } catch(e) { return hex; }
}

    foundText: foundHex,
    obsBg: `rgba(${r},${g},${b},${alpha})`,

  };
}

}

function applyPreset(name) {

  saveDesign(p);
  renderDesignPanel();
}

const HOTKEY_KEY = "er-hunt-hotkey";
let currentHotkey = localStorage.getItem(HOTKEY_KEY) || "F";
let hotkeyListening = false;

function setupHotkey(playerName) {
  document.addEventListener("keydown", (e) => {
    if(hotkeyListening) return;
    if(document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
    const key = e.key.toUpperCase();
    if(key === currentHotkey.toUpperCase()) {
      e.preventDefault();
      const btn = document.querySelector(".btn-found:not([disabled])");
      if(btn) btn.click();
    }
  });
}

function renderHotkeyConfig() {
  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.style.marginBottom = "1rem";
  wrap.innerHTML = `
    <div class="card-title">Hotkey – Gefunden!</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:13px;color:var(--text-dim)">Aktuelle Taste:</span>
      <span class="hotkey-badge" id="hotkey-display">${currentHotkey}</span>
      <button class="btn btn-sm" id="hotkey-set-btn">Ändern</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Drücke diese Taste im Browser um "Gefunden!" auszulösen.</div>
  `;

  const setBtn = wrap.querySelector("#hotkey-set-btn");
  const display = wrap.querySelector("#hotkey-display");

  setBtn.addEventListener("click", () => {
    if(hotkeyListening) return;
    hotkeyListening = true;
    display.textContent = "Taste drücken…";
    display.classList.add("hotkey-listening");
    setBtn.disabled = true;

    const listener = (e) => {
      e.preventDefault();
      const key = e.key === " " ? "Space" : e.key.length === 1 ? e.key.toUpperCase() : e.key;
      currentHotkey = key;
      localStorage.setItem(HOTKEY_KEY, key);
      display.textContent = key;
      display.classList.remove("hotkey-listening");
      setBtn.disabled = false;
      hotkeyListening = false;
      document.removeEventListener("keydown", listener, true);
    };
    document.addEventListener("keydown", listener, true);
  });

  return wrap;
}

let _errorTimer = null;

function showError(msg, durationMs = 6000) {
  const el = document.getElementById("global-error");
  if(!el) { console.error("FEHLER:", msg); return; }
  el.className = "";
  el.textContent = "⚠ " + msg;
  el.style.display = "block";
  clearTimeout(_errorTimer);
  _errorTimer = setTimeout(() => { el.style.display = "none"; }, durationMs);
  console.error("FEHLER:", msg);
}

function showSuccess(msg, durationMs = 3000) {
  const el = document.getElementById("global-error");
  if(!el) return;
  el.className = "success";
  el.textContent = "✓ " + msg;
  el.style.display = "block";
  clearTimeout(_errorTimer);
  _errorTimer = setTimeout(() => { el.style.display = "none"; }, durationMs);
}

function hideError() {
  const el = document.getElementById("global-error");
  if(el) el.style.display = "none";
}

const JSONBIN_KEY = "$2a$10$1EOndwL6ne3ST5/fsDMuNehlBDuy5EsYsaoQtUz3y/pBOr0QOK5xa";
const JSONBIN_API = "https://api.jsonbin.io/v3/b";
// Key-Version: wenn sich der Key ändert, alte Bin-ID automatisch löschen
const JSONBIN_KEY_VERSION = "v2";
if(localStorage.getItem("er-hunt-key-version") !== JSONBIN_KEY_VERSION) {
  localStorage.removeItem("er-hunt-binid");
  localStorage.setItem("er-hunt-key-version", JSONBIN_KEY_VERSION);
}
const _urlBinId = new URLSearchParams(location.search).get("bin");
let _binId = _urlBinId || localStorage.getItem("er-hunt-binid") || null;

async function saveState(data) {
  try {
    if (!_binId) {
      const res = await fetch(JSONBIN_API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": JSONBIN_KEY,
          "X-Bin-Name": "er-hunt-gamestate",
          "X-Bin-Private": "false"
        },
        body: JSON.stringify(data)
      });
      if(!res.ok) {
        const txt = await res.text();
        throw new Error(`Spiel konnte nicht gespeichert werden (${res.status}): ${txt}`);
      }
      const json = await res.json();
      if(!json.metadata || !json.metadata.id) {
        throw new Error("Kein Bin-ID von JSONBin erhalten. Antwort: " + JSON.stringify(json).slice(0,100));
      }
      _binId = json.metadata.id;
      localStorage.setItem("er-hunt-binid", _binId);
    } else {
      const res = await fetch(`${JSONBIN_API}/${_binId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": JSONBIN_KEY
        },
        body: JSON.stringify(data)
      });
      if(!res.ok) {
        const txt = await res.text();
        // Bin existiert nicht mehr – reset und neu versuchen
        if(res.status === 404) {
          _binId = null;
          localStorage.removeItem("er-hunt-binid");
          throw new Error("Spielstand nicht gefunden (404). Bitte Spiel neu erstellen.");
        }
        throw new Error(`Spielstand konnte nicht aktualisiert werden (${res.status}): ${txt}`);
      }
    }
  } catch(e) {
    showError(e.message || "Unbekannter Speicherfehler");
    throw e; // re-throw so callers can handle
  }
}

async function loadState() {
  if (!_binId) return null;
  try {
    const res = await fetch(`${JSONBIN_API}/${_binId}/latest`, {
      headers: {
        "X-Master-Key": JSONBIN_KEY,
        "X-Bin-Meta": "false"
      }
    });
    if(res.status === 401 || res.status === 403) {
      showError("JSONBin-Zugriff verweigert – API-Key ungültig oder abgelaufen.");
      return null;
    }
    if(res.status === 404) {
      showError("Spielstand nicht gefunden – bitte Spiel neu erstellen.");
      _binId = null; localStorage.removeItem("er-hunt-binid");
      return null;
    }
    if(!res.ok) {
      showError(`Verbindungsfehler beim Laden (${res.status}).`);
      return null;
    }
    return await res.json();
  } catch(e) {
    showError("Netzwerkfehler: " + (e.message || "Keine Verbindung."));
    return null;
  }
}

async function resetBin() {
  _binId = null;
  localStorage.removeItem("er-hunt-binid");
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getParams() {
  const p = new URLSearchParams(location.search);
  return { mode: p.get("mode")||"host", player: p.get("player")||"" };
}

function baseUrl() {
  return location.origin + location.pathname;
}

function copyText(text) {
  navigator.clipboard.writeText(text).catch(()=>{});
}

function el(tag,attrs={},children=[]) {
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)) {
    if(k==="class") e.className=v;
    else if(k==="style" && typeof v==="object") Object.assign(e.style,v);
    else e.setAttribute(k,v);
  }
  for(const c of children) {
    if(typeof c==="string") e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  }
  return e;
}

  if(view==="setup") {
    page.appendChild(renderSetupForm());
  } else if(view==="urls") {
    page.appendChild(renderUrls(gameData));
  } else if(view==="running") {
    page.appendChild(renderHostRunning(gameData));
  }

  app.appendChild(page);
}

async function createGame(names) {
  let pool = ITEMS;
  if(!hostState.selectedCats.includes("Alle")) {
    pool = pool.filter(it=>hostState.selectedCats.includes(it.cat));
  }
  if(!hostState.selectedAreas.includes("Alle Gebiete")) {
    pool = pool.filter(it=>it.area && it.area.some(a=>hostState.selectedAreas.includes(a)));
  }
  if(pool.length===0) pool=ITEMS;

  const endless  = hostState.endless;
  const gameMode = hostState.gameMode || "shared";
  const count    = endless ? pool.length : Math.min(hostState.itemCount, pool.length);

  const scores = {};
  names.forEach(n => scores[n] = 0);

  let gameData;

  if(gameMode === "shared") {
    // Modus 1: alle teilen eine Queue
    const queue = shuffle([...pool]).slice(0, count);
    gameData = {
      status: "waiting", gameMode,
      players: names, queue, fullPool: pool,
      endless, currentIdx: 0, round: 1,
      scores, history: [], createdAt: Date.now(),
    };

  } else if(gameMode === "same-order") {
    // Modus 2: gleiche Reihenfolge, jeder eigene Fortschrittsanzeige
    const sharedQueue = shuffle([...pool]).slice(0, count);
    const playerStates = {};
    names.forEach(n => {
      playerStates[n] = { queue: [...sharedQueue], currentIdx: 0, round: 1, finished: false };
    });
    gameData = {
      status: "waiting", gameMode,
      players: names, fullPool: pool, sharedQueue,
      endless, playerStates,
      scores, history: [], createdAt: Date.now(),
    };

  } else {
    // Modus 3: eigene Reihenfolge, jeder komplett eigene zufällige Queue
    const playerStates = {};
    names.forEach(n => {
      const q = shuffle([...pool]).slice(0, count);
      playerStates[n] = { queue: q, currentIdx: 0, round: 1, finished: false };
    });
    gameData = {
      status: "waiting", gameMode,
      players: names, fullPool: pool,
      endless, playerStates,
      scores, history: [], createdAt: Date.now(),
    };
  }

  try {
    await saveState(stripForSave(gameData));
    showSuccess("Spiel erfolgreich erstellt!");
    renderHost("urls", gameData);
  } catch(e) {
    // error already shown by saveState
  }
}

// Hilfsfunktion: fullPool vor dem Speichern entfernen (zu groß für JSONBin)
function stripForSave(data) {
  const d = {...data};
  delete d.fullPool;
  return d;
}

let hostPollTimer = null;

function pollHostState() {
  if(hostPollTimer) clearInterval(hostPollTimer);
  hostPollTimer = setInterval(async () => {
    try {
      const data = await loadState();
      if(!data) return;
      renderHost("running", data);
    } catch(e) { /* showError already called */ }
  }, 2000);
}

function renderHostRunning(data) {
  const wrap = el("div");

  // Scores
  const scoresCard = el("div",{class:"card"});
  scoresCard.innerHTML = `<div class="card-title">Punktestand</div>`;
  const scoresDiv = el("div",{class:"scores"});
  const maxPts = Math.max(...Object.values(data.scores),0);
  data.players.forEach(p => {
    const pts = data.scores[p]||0;
    const chip = el("div",{class:`score-pill ${pts===maxPts&&pts>0?"leader":""}`});
    chip.innerHTML = `<div class="score-name">${p}</div>
      <div class="score-pts">${pts}</div>
      ${pts===maxPts&&pts>0?`<div class="score-crown">Führend</div>`:""}`;
    scoresDiv.appendChild(chip);
  });
  scoresCard.appendChild(scoresDiv);
  wrap.appendChild(scoresCard);

  // Current item or finished
  const isShared = data.gameMode==="shared" || !data.gameMode;
  if(data.status==="finished" || (isShared && data.currentIdx >= data.queue.length)) {
    const w = el("div",{class:"winner-card"});
    const maxP = Math.max(...Object.values(data.scores));
    const winners = data.players.filter(p=>data.scores[p]===maxP);
    w.innerHTML = `<div class="winner-title">${winners.length===1?winners[0]+" gewinnt!":"Unentschieden!"}</div>
      <div class="winner-sub">Alle ${data.queue.length} Items wurden gefunden.</div>`;
    wrap.appendChild(w);

    const btnRow = el("div",{class:"btn-row"});
    const resetBtn = el("button",{class:"btn btn-primary"});
    resetBtn.textContent = "Neues Spiel";
    resetBtn.addEventListener("click", async () => { if(hostPollTimer) clearInterval(hostPollTimer); try { await resetBin(); } catch(e){} renderHost("setup"); });
    btnRow.appendChild(resetBtn);
    wrap.appendChild(btnRow);
    return wrap;
  }

  // Determine what to show for host view
  // In shared mode: show single current item
  // In per-player modes: show each player's current item
  const cur = (data.gameMode==="shared"||!data.gameMode) ? data.queue[data.currentIdx] : null;

  // Last found banner
  const lastFound = data.history[0];
  if(lastFound) {
    const banner = el("div",{class:"found-banner"});
    banner.textContent = `${lastFound.item} – gefunden von ${lastFound.player}`;
    wrap.appendChild(banner);
  }

  if(isShared) {
    // ── Modus 1: eine gemeinsame Anzeige ──
    const itemCard = el("div",{class:"card"});
    const prog = el("div",{class:"progress-text"});
    prog.textContent = data.endless ? `Runde ${data.round||1} · Item ${data.currentIdx+1}/${data.queue.length}` : `Item ${data.currentIdx+1} von ${data.queue.length}`;
    itemCard.appendChild(prog);
    const disp = el("div",{class:"item-display"});
    const imgWrap = el("div",{class:"item-img-wrap"});
    const img = el("img",{src:itemImgUrl(cur), alt:cur.name, loading:"lazy"});
    img.onerror = () => { imgWrap.innerHTML = `<span style="font-size:28px;color:var(--text-muted)">?</span>`; };
    imgWrap.appendChild(img);
    disp.appendChild(imgWrap);
    disp.innerHTML += `<div class="item-cat-badge">${cur.cat}</div>
      <div class="item-name-de">${cur.name}</div>
      <div class="item-name-en">${cur.en||""}</div>
      <div class="item-hint"><div class="item-hint-label">Fundort</div>${cur.hint}</div>`;
    disp.insertBefore(imgWrap, disp.firstChild);
    itemCard.appendChild(disp);
    wrap.appendChild(itemCard);
  } else {
    // ── Modus 2+3: pro Spieler ein Item anzeigen ──
    const perPlayerCard = el("div",{class:"card"});
    perPlayerCard.innerHTML = `<div class="card-title">Aktuelles Item pro Spieler</div>`;
    data.players.forEach(p => {
      const ps = data.playerStates && data.playerStates[p];
      if(!ps) return;
      const pItem = ps.finished ? null : ps.queue[ps.currentIdx];
      const row = el("div",{style:"display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)"});
      const nameEl = el("div",{style:"min-width:90px;font-size:13px;color:var(--text-dim)"});
      nameEl.textContent = p;
      row.appendChild(nameEl);
      if(pItem) {
        const imgEl = el("div",{class:"item-img-wrap",style:"width:48px;height:48px;margin:0;flex-shrink:0"});
        const im = el("img",{src:itemImgUrl(pItem),alt:pItem.name,loading:"lazy",style:"width:40px;height:40px"});
        im.onerror=()=>{imgEl.innerHTML=`<span style="font-size:18px">?</span>`;};
        imgEl.appendChild(im);
        row.appendChild(imgEl);
        const info = el("div");
        info.innerHTML = `<div style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold)">${pItem.name}</div>
          <div style="font-size:11px;color:var(--text-muted)">${pItem.cat} · Item ${ps.currentIdx+1}/${ps.queue.length}</div>`;
        row.appendChild(info);
      } else {
        const done = el("div",{style:"font-size:12px;color:var(--green)"});
        done.textContent = "✓ Queue beendet";
        row.appendChild(done);
      }
      perPlayerCard.appendChild(row);
    });
    wrap.appendChild(perPlayerCard);
  }

  // Host controls
  const ctrlCard = el("div",{class:"card"});
  ctrlCard.innerHTML = `<div class="card-title">Host-Steuerung</div>`;
  const btns = el("div",{class:"btn-row"});

  if(isShared) {
    // Shared: alle Spieler als mögliche Finder
    data.players.forEach(p => {
      const b = el("button",{class:"btn"});
      b.textContent = `✓ ${p} gefunden`;
      b.style.fontSize="12px";
      b.addEventListener("click", async () => markFoundHost(p));
      btns.appendChild(b);
    });
  } else {
    // Per-player: für jeden Spieler sein eigenes "gefunden" Button
    data.players.forEach(p => {
      const ps = data.playerStates && data.playerStates[p];
      const done = ps && ps.finished;
      const b = el("button",{class:"btn"});
      b.textContent = done ? `✓ ${p} fertig` : `✓ ${p} gefunden`;
      b.style.fontSize="12px";
      b.disabled = done;
      b.addEventListener("click", async () => markFoundHost(p));
      btns.appendChild(b);
    });
  }

  const skipBtn = el("button",{class:"btn btn-danger btn-sm"});
  skipBtn.textContent = "Item überspringen";
  skipBtn.addEventListener("click", async () => {
    let current;
    try { current = await loadState(); } catch(e) { return; }
    if(!current) { showError("Spielstand nicht gefunden."); return; }
    if(current.gameMode === "shared" || !current.gameMode) {
      current.history.unshift({item:current.queue[current.currentIdx].name, player:"–", itemIdx:current.currentIdx, skipped:true});
      if(current.currentIdx >= current.queue.length-1) {
        if(current.endless) reshuffleQueue(current, null); else current.status="finished";
      } else { current.currentIdx++; }
    }
    // skip not applicable for per-player modes (each player manages own progress)
    await saveState(stripForSave(current));
    renderHostRunning(current);
  });

  ctrlCard.appendChild(btns);
  ctrlCard.appendChild(el("div",{class:"mt-sm"}));
  ctrlCard.appendChild(skipBtn);
  wrap.appendChild(ctrlCard);

  // History
  if(data.history.length>0) {
    const histCard = el("div",{class:"card"});
    histCard.innerHTML = `<div class="card-title">Verlauf</div>`;
    data.history.slice(0,6).forEach(h=>{
      const row = el("div",{class:"history-row"});
      row.innerHTML = `<span class="history-round">#${(h.itemIdx||0)+1}</span>
        <span class="history-item">${h.item}</span>
        <span class="${h.skipped?"history-skip":"history-player"}">${h.skipped?"übersprungen":h.player}</span>`;
      histCard.appendChild(row);
    });
    wrap.appendChild(histCard);
  }

  const stopRow = el("div",{class:"btn-row"});
  const stopBtn = el("button",{class:"btn btn-danger btn-sm"});
  stopBtn.textContent = "Spiel beenden";
  stopBtn.addEventListener("click", async () => {
    if(!confirm("Spiel wirklich beenden?")) return;
    let current;
    try { current = await loadState(); } catch(e) { return; }
    if(!current) { showError("Spielstand nicht gefunden."); return; }
    current.status="finished";
    await saveState(stripForSave(current));
    if(hostPollTimer) clearInterval(hostPollTimer);
    renderHostRunning(current);
  });
  stopRow.appendChild(stopBtn);
  wrap.appendChild(stopRow);

  return wrap;
}


function reshuffleQueue(data, playerName) {
  // Rebuild pool from ITEMS (fullPool is not stored in JSONBin)
  const pool = data.queue || [];
  const reshuffled = shuffle([...pool]);
  if(data.gameMode === "shared") {
    data.queue = reshuffled;
    data.currentIdx = 0;
    data.round = (data.round || 1) + 1;
  } else {
    const ps = data.playerStates[playerName];
    ps.queue = shuffle([...ps.queue]);
    ps.currentIdx = 0;
    ps.round = (ps.round || 1) + 1;
    ps.finished = false;
  }
}

function allSpielerFinished(data) {
  if(!data.playerStates) return false;
  return data.players.every(p => data.playerStates[p] && data.playerStates[p].finished);
}
async function markFoundHost(playerName) {
  const data = await loadState();
  if(!data || data.status!=="running") return;

  if(data.gameMode === "shared" || !data.gameMode) {
    // Modus 1
    if(data.currentIdx >= data.queue.length) return;
    const cur = data.queue[data.currentIdx];
    data.scores[playerName] = (data.scores[playerName]||0)+1;
    data.history.unshift({item:cur.name, player:playerName, itemIdx:data.currentIdx});
    if(data.currentIdx >= data.queue.length-1) {
      if(data.endless) reshuffleQueue(data, playerName); else data.status="finished";
    } else { data.currentIdx++; }

  } else {
    // Modus 2 + 3: per-player progress
    const ps = data.playerStates[playerName];
    if(!ps || ps.finished) return;
    const cur = ps.queue[ps.currentIdx];
    data.scores[playerName] = (data.scores[playerName]||0)+1;
    data.history.unshift({item:cur.name, player:playerName, itemIdx:ps.currentIdx});
    if(ps.currentIdx >= ps.queue.length-1) {
      if(data.endless) reshuffleQueue(data, playerName);
      else { ps.finished = true; if(allSpielerFinished(data)) data.status="finished"; }
    } else { ps.currentIdx++; }
  }

  try {
    await saveState(stripForSave(data));
  } catch(e) { return; }
  renderHostRunning(data);
}

function initObs() {

async function renderObs() {
  let data;
  try {
    data = await loadState();
  } catch(e) { return; }
  const inner = document.getElementById("obs-inner");
  if(!inner) return;

  if(!data || data.status==="waiting") {
    inner.innerHTML = `<div class="obs-header">Item Hunt · Warte auf Start…</div>`;
    return;
  }

  if(data.status==="finished" || data.currentIdx>=data.queue.length) {
    const maxP = Math.max(...Object.values(data.scores));
    const winners = data.players.filter(p=>data.scores[p]===maxP);
    inner.innerHTML = `<div class="obs-header">Item Hunt · Abgeschlossen</div>
      <div class="obs-finished">${winners.length===1?winners[0]+" gewinnt!":"Unentschieden!"}</div>
      <div class="obs-scores">${renderObsScores(data)}</div>`;
    return;
  }

  const cur = data.queue[data.currentIdx];
  const maxPts = Math.max(...Object.values(data.scores),0);

  inner.innerHTML = `
    <div class="obs-header">Item Hunt · ${data.endless ? 'Runde '+(data.round||1)+' · ' : ''}Item ${data.currentIdx+1}/${data.queue.length}</div>
    <div class="obs-item-row">
      <div class="obs-img"><img src="${itemImgUrl(cur)}" alt="${cur.name}" onerror="this.parentNode.innerHTML='<span style=font-size:32px;color:var(--text-muted)>?</span>'" /></div>
      <div style="flex:1">
        <div class="obs-item-name">${cur.name}</div>
        <div class="obs-item-en">${cur.en}</div>
        <div class="obs-item-cat">${cur.cat}</div>
      </div>
    </div>
    <div class="obs-hint"><strong style="color:var(--text-dim);font-size:13px;letter-spacing:.1em">FUNDORT</strong><br>${cur.hint}</div>
    <div class="obs-scores">${renderObsScores(data)}</div>
  `;
}

function renderObsScores(data) {
  const maxPts = Math.max(...Object.values(data.scores),0);
  return data.players.map(p=>{
    const pts=data.scores[p]||0;
    const leader=pts===maxPts&&pts>0;
    return `<div class="obs-score-chip ${leader?"leader":""}">
      <span class="obs-score-name">${p}</span>
      <span class="obs-score-pts">${pts}</span>
    </div>`;
  }).join("");
}

// ══════════════════════════════════════════════════════════════
//  PLAYER MODE
// ══════════════════════════════════════════════════════════════
function initPlayer(playerName) {
  const app = document.getElementById("app");
  const page = el("div",{class:"page"});
  page.appendChild(renderLogo());
  const header = el("div",{class:"player-header"});
  header.innerHTML = `<div class="player-name-tag">${playerName}</div>`;
  page.appendChild(header);
  // Hotkey config
  page.appendChild(renderHotkeyConfig());
  const content = el("div",{"id":"player-content"});
  page.appendChild(content);
  app.appendChild(page);
  renderPlayerView(playerName);
  setInterval(() => renderPlayerView(playerName), 3000);
}

let lastPlayerItemIdx = -1;
let foundDisabled = false;

async function renderPlayerView(playerName) {
  let data;
  try {
    data = await loadState();
  } catch(e) {
    // error already shown by loadState
    return;
  }
  const content = document.getElementById("player-content");
  if(!content) return;

  if(!data || data.status==="waiting") {
    content.innerHTML = `<div class="card"><div class="waiting-pulse">Warte auf Spielstart…</div></div>`;
    lastPlayerItemIdx = -1;
    return;
  }

  // Check if this player (or whole game) is done
  const globalFinished = data.status==="finished";
  const playerDone = globalFinished ||
    (data.gameMode==="shared"||!data.gameMode
      ? data.currentIdx>=data.queue.length
      : (data.playerStates && data.playerStates[playerName] && data.playerStates[playerName].finished));

  if(playerDone) {
    const maxP = Math.max(...Object.values(data.scores));
    const myPts2 = data.scores[playerName]||0;
    const winners = data.players.filter(p=>data.scores[p]===maxP);
    const stillPlaying = !globalFinished && (data.gameMode!=="shared");
    content.innerHTML = `<div class="winner-card">
      <div class="winner-title">${globalFinished?(winners.includes(playerName)?"Du gewinnst! 🏆":"Spiel beendet"):"Deine Queue beendet ✓"}</div>
      <div class="winner-sub">${stillPlaying?"Warte auf die anderen Spieler…":"Deine Punkte: "+myPts2}</div>
    </div>
    <div class="scores">${data.players.map(p=>{const pts=data.scores[p]||0;return `<div class="score-pill ${pts===maxP&&pts>0?"leader":""}"><div class="score-name">${p}</div><div class="score-pts">${pts}</div></div>`;}).join("")}</div>`;
    return;
  }

  // Reset found-button when item changes
  if(data.currentIdx !== lastPlayerItemIdx) {
    lastPlayerItemIdx = data.currentIdx;
    foundDisabled = false;
  }

  // Determine current item based on mode
  let cur, myIdx, myQueueLen, myRound, myFinished;
  if(data.gameMode === "shared" || !data.gameMode) {
    cur       = data.queue[data.currentIdx];
    myIdx     = data.currentIdx;
    myQueueLen= data.queue.length;
    myRound   = data.round || 1;
    myFinished= false;
  } else {
    const ps  = data.playerStates && data.playerStates[playerName];
    if(!ps) { content.innerHTML=`<div class="card"><div class="waiting-pulse">Spieler nicht gefunden…</div></div>`; return; }
    cur       = ps.queue[ps.currentIdx];
    myIdx     = ps.currentIdx;
    myQueueLen= ps.queue.length;
    myRound   = ps.round || 1;
    myFinished= ps.finished || false;
  }
  const myPts = data.scores[playerName]||0;

  // Check if already found by someone (in history for current item)
  const alreadyFound = (data.gameMode==="shared"||!data.gameMode)
    ? data.history.some(h=>h.itemIdx===data.currentIdx && !h.skipped)
    : myFinished;

  content.innerHTML = "";

  // Scores
  const scCard = el("div",{class:"card"});
  const maxPts2 = Math.max(...Object.values(data.scores),0);
  const sdiv = el("div",{class:"scores"});
  data.players.forEach(p=>{
    const pts=data.scores[p]||0;
    const chip=el("div",{class:`score-pill ${pts===maxPts2&&pts>0?"leader":""}`});
    chip.innerHTML=`<div class="score-name">${p}</div><div class="score-pts">${pts}</div>`;
    sdiv.appendChild(chip);
  });
  scCard.appendChild(sdiv);
  content.appendChild(scCard);

  // Item
  const ic = el("div",{class:"card"});
  const prog = el("div",{class:"progress-text"});
  prog.textContent = data.endless ? `Runde ${data.round||1} · Item ${data.currentIdx+1}/${data.queue.length}` : `Item ${data.currentIdx+1} von ${data.queue.length}`;
  ic.appendChild(prog);

  const disp = el("div",{class:"item-display"});
  const imgW = el("div",{class:"item-img-wrap"});
  const img2 = el("img",{src:itemImgUrl(cur),alt:cur.name,loading:"lazy"});
  img2.onerror=()=>{imgW.innerHTML=`<span style="font-size:36px;color:var(--text-muted)">?</span>`;};
  imgW.appendChild(img2);
  disp.appendChild(imgW);

  const catB = el("div",{class:"item-cat-badge"});
  catB.textContent=cur.cat;
  disp.appendChild(catB);

  const nameD = el("div",{class:"item-name-de"});
  nameD.textContent=cur.name;
  disp.appendChild(nameD);

  const nameE = el("div",{class:"item-name-en"});
  nameE.textContent=cur.en;
  disp.appendChild(nameE);

  const hintD = el("div",{class:"item-hint"});
  hintD.innerHTML=`<div class="item-hint-label">Fundort</div>${cur.hint}`;
  disp.appendChild(hintD);

  ic.appendChild(disp);
  content.appendChild(ic);

  // Found button
  const btnCard = el("div",{class:"card"});
  const foundBtn = el("button",{class:"btn btn-found"});
  foundBtn.disabled = foundDisabled || alreadyFound;

  if(alreadyFound) {
    if(data.gameMode==="shared"||!data.gameMode) {
      const finder = data.history.find(h=>h.itemIdx===data.currentIdx&&!h.skipped);
      foundBtn.textContent = finder ? `Gefunden von ${finder.player}` : "Bereits gefunden";
    } else {
      foundBtn.textContent = "✓ Queue abgeschlossen";
    }
    foundBtn.style.opacity="0.5";
  } else if(foundDisabled) {
    foundBtn.textContent = "Wird gespeichert…";
    foundBtn.style.opacity="0.5";
  } else {
    foundBtn.textContent = "Gefunden! ✓";
    foundBtn.addEventListener("click", () => handlePlayerFound(playerName));
  }

  btnCard.appendChild(foundBtn);
  content.appendChild(btnCard);
}

async function handlePlayerFound(playerName) {
  foundDisabled = true;
  // re-render immediately with disabled state
  document.querySelectorAll(".btn-found").forEach(b=>{b.disabled=true;b.textContent="Wird gespeichert…";});

  const data = await loadState();
  if(!data) { foundDisabled=false; showError("Keine Verbindung zum Spielserver. Prüfe deine Internetverbindung."); return; }
  if(data.status!=="running") {
    foundDisabled=false;
    if(data.status==="waiting") showError("Das Spiel wurde noch nicht gestartet – warte auf den Host.");
    else renderPlayerView(playerName);
    return;
  }

  // Race condition check handled per-mode below

  if(data.gameMode === "shared" || !data.gameMode) {
    // Modus 1: shared queue, race condition check
    const alreadyFound2 = data.history.some(h=>h.itemIdx===data.currentIdx&&!h.skipped);
    if(alreadyFound2) { foundDisabled=false; renderPlayerView(playerName); return; }
    const cur = data.queue[data.currentIdx];
    data.scores[playerName]=(data.scores[playerName]||0)+1;
    data.history.unshift({item:cur.name, player:playerName, itemIdx:data.currentIdx});
    if(data.currentIdx >= data.queue.length-1) {
      if(data.endless) reshuffleQueue(data, playerName); else data.status="finished";
    } else { data.currentIdx++; }

  } else {
    // Modus 2 + 3: per-player progress
    const ps = data.playerStates && data.playerStates[playerName];
    if(!ps) { foundDisabled=false; showError("Spieler \"" + playerName + "\" nicht im Spiel gefunden. Prüfe ob der Link korrekt ist."); return; }
    if(ps.finished) { foundDisabled=false; renderPlayerView(playerName); return; }
    const cur = ps.queue[ps.currentIdx];
    data.scores[playerName]=(data.scores[playerName]||0)+1;
    data.history.unshift({item:cur.name, player:playerName, itemIdx:ps.currentIdx});
    if(ps.currentIdx >= ps.queue.length-1) {
      if(data.endless) reshuffleQueue(data, playerName);
      else { ps.finished=true; if(allSpielerFinished(data)) data.status="finished"; }
    } else { ps.currentIdx++; }
  }

  try {
    await saveState(stripForSave(data));
  } catch(e) {
    foundDisabled = false;
    renderPlayerView(playerName);
    return;
  }
  foundDisabled = false;
  renderPlayerView(playerName);
}
</script>
